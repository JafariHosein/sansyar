services:
  db:
    image: mysql:8.4
    container_name: sansyar-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: sansyar
      MYSQL_DATABASE: sansyar
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-psansyar"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
